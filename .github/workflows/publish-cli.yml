# 把启动器 `qqbot-cli` 发布到 PyPI。
#
# **不需要在仓库里存任何 token**：用的是 PyPI 的 Trusted Publishing（OIDC）。
# 触发时 GitHub 给这个 job 签一张短期身份票据，PyPI 验过就发一个一次性上传令牌。
#
# 前提（在 PyPI 网页上配一次，见 docs/PUBLISHING.md）：
#   PyPI → Account settings → Publishing → Add a new pending publisher
#     PyPI Project Name : qqbot-cli
#     Owner             : L-web666
#     Repository name   : QQBotMerged
#     Workflow name     : publish-cli.yml
#     Environment name  : pypi
#   **这五项必须与下面完全一致**，否则 OIDC 校验会失败。
#
# 触发方式：
#   ① 在 GitHub 的 Actions 页面手动点 "Run workflow"（推荐先这样验证）
#   ② 推一个 `cli-v*` 的 tag，比如 `cli-v1.0.2`
#
# 注意：这里发的是**启动器**（PyPI 包名 qqbot-cli），
# 和主程序的版本号（core/version.py）是两套号，互不影响。

name: Publish qqbot-cli to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布（检查打包是否正常）"
        type: boolean
        default: false
  push:
    tags:
      - "cli-v*"

# 默认不给任何权限；下面每个 job 按需单独开。
# 这样即使有人往这个文件里插了一个步骤，它也拿不到多余的 token。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 先跑测试
  # **构建成功不等于测试通过**。发布前必须真的把这些测试跑一遍，
  # 尤其是启动器自己的（test_launcher / test_uninstall）。
  test:
    name: 跑测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions 固定到完整 commit SHA：可移动的 tag（@v4）被替换时不会悄悄换成别的代码。
      # 升级方式：改这里的 SHA，并在右边的注释里更新版本号。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: 装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 启动器测试
        run: |
          python tests/unit/test_launcher.py
          python tests/unit/test_uninstall.py

      - name: 主程序回归
        run: |
          python tests/test_offline.py
          python tests/check_frontend.py

  # ---------------------------------------------------------------- 构建
  build:
    name: 构建并检查
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: 装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 装打包工具
        run: python -m pip install --upgrade build twine

      - name: 构建
        run: python -m build

      - name: 检查元数据
        run: python -m twine check dist/*

      - name: 确认只打包了启动器（主程序代码不该进包）
        run: |
          set -e
          echo "--- 包里有哪些顶层模块 ---"
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "没有生成 whl"
          names = zipfile.ZipFile(wheels[0]).namelist()
          tops = sorted({n.split("/")[0] for n in names})
          print(tops)
          # 只应该有 qqbot_cli 与 dist-info
          bad = [t for t in tops if t != "qqbot_cli" and not t.endswith(".dist-info")]
          assert not bad, "包里混进了不该有的东西：%s" % bad
          assert "qqbot_cli/cli.py" in names, "缺 qqbot_cli/cli.py"
          print("OK：只打包了 qqbot_cli")
          PY

      - name: 保存构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------- 发布
  publish:
    name: 发布到 PyPI
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # 与 PyPI 上配置的 Environment name 必须一致。
    # 建议在仓库 Settings → Environments → pypi 里配 Required reviewers，
    # 这样每次发布会停下来等人工点同意。
    environment: pypi
    permissions:
      # Trusted Publishing 必需：允许 job 向 GitHub 要一张 OIDC 身份票据。
      # 只开这一项 —— 发布 job 不需要读代码、不需要写仓库。
      id-token: write
      contents: read
    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: 上传到 PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          # 只传 sdist + whl，不额外生成
          packages-dir: dist/
