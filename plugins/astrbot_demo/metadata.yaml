name: astrbot_demo
display_name: AstrBot 示例插件
short_desc: 演示 AstrBot 插件格式（指令 / 图片 / 管理员）
desc: |
  AstrBot 插件格式示例，用来验证本程序的兼容层。

  指令：
  - `/astrbot`（别名 `/ab`）：回一段文字，显示会话信息
  - `/ab图`：回一张图片
  - `/ab管理`（别名 `/abadmin`）：只有管理员能用

  不需要这个示例时，直接删掉本目录即可。
version: 1.0.0
author: QQBOT 合并版
astrbot_version: ">=4.0.0"
support_platforms:
  - qq_official
tags:
  - demo
